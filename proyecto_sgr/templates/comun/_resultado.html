{% comment %}
  El resultado de la última operación.

  Se publica como JSON para que sgr-app.js lo muestre con SweetAlert2, y se
  repite dentro de <noscript> para que sin JavaScript el resultado igual se
  lea. El dato lo deja la vista en la sesión después de guardar, así que este
  bloque solo aparece cuando la operación ya terminó.
{% endcomment %}
{% if sgr_resultado %}
  {{ sgr_resultado|json_script:"sgr-resultado" }}
  <noscript>
    <div class="notice {% if sgr_resultado.icono == 'success' %}ok{% elif sgr_resultado.icono == 'error' %}bad{% elif sgr_resultado.icono == 'warning' %}warn{% else %}info{% endif %}" role="status">
      <svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8h.01"/></svg>
      <div>
        <b>{{ sgr_resultado.titulo }}</b>{{ sgr_resultado.texto }}
        {% for accion in sgr_resultado.acciones %}
          <a class="link" href="{{ accion.url }}">{{ accion.texto }}</a>{% if not forloop.last %} · {% endif %}
        {% endfor %}
      </div>
    </div>
  </noscript>
{% endif %}
